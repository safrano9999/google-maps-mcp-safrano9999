# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Google Maps MCP HTTP image
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: New YYYY.M.N release version
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: google-maps-mcp-release
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_NAME: ghcr.io/safrano9999/google-maps-mcp-safrano9999
      IMAGE_TAG: ${{ inputs.image_tag }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate unused release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.[1-9][0-9]*$ ]]
          if tags="$(gh api --paginate 'users/safrano9999/packages/container/google-maps-mcp-safrano9999/versions?per_page=100' --jq '.[].metadata.container.tags[]' 2>/tmp/package-error)"; then
            if grep -Fxq "$IMAGE_TAG" <<< "$tags"; then echo 'Version already exists' >&2; exit 1; fi
          else
            grep -q '(HTTP 404)' /tmp/package-error || { cat /tmp/package-error; exit 1; }
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/scripts/Containerfile
          build-args: MCP_REVISION=${{ github.sha }}
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: maps-candidate:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.safrano9999.build.commit=${{ github.sha }}
      - name: Verify runtime and HTTP MCP without external traffic
        run: |
          set -euo pipefail
          image="maps-candidate:$GITHUB_SHA"
          container="$(docker run --pull=never --network none -e GOOGLE_MAPS_API_KEY=ci-placeholder -d "$image")"
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if docker exec "$container" node -e 'fetch("http://127.0.0.1:8000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then ready=1; break; fi
            test "$(docker inspect --format '{{.State.Running}}' "$container")" = true || break
            sleep 1
          done
          test "$ready" = 1
          test "$(docker exec "$container" node --version)" = v26.12.1
          test "$(docker exec "$container" node -p 'require("/usr/local/lib/node_modules/supergateway/package.json").version')" = 4.1.0
          docker exec -i "$container" node --input-type=module < .github/scripts/mcp-smoke.mjs
      - name: Verify baremetal native HTTP entry point
        run: |
          set -euo pipefail
          container="$(docker run --pull=never --network none -e GOOGLE_MAPS_API_KEY=ci-placeholder --entrypoint node -d "maps-candidate:$GITHUB_SHA" dist/index.js)"
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if docker exec "$container" node -e 'fetch("http://127.0.0.1:8000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then ready=1; break; fi
            test "$(docker inspect --format '{{.State.Running}}' "$container")" = true || break
            sleep 1
          done
          test "$ready" = 1
          docker exec -i "$container" node --input-type=module < .github/scripts/mcp-smoke.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested release and latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker tag "maps-candidate:$GITHUB_SHA" "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "maps-candidate:$GITHUB_SHA" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:latest"
          test "$(gh api users/safrano9999/packages/container/google-maps-mcp-safrano9999 --jq .visibility)" = private
